@if (medico) {
  <div class="contMed">
    <div class="nomMed">
      <h4>{{ medico.nombre }}</h4>
    </div>

    <div class="datosMed">
      <p>Registro Médico: {{ medico.codigoRegistro }}</p>
      <p>Especialidad: {{ medico.especialidad }}</p>
      <p>Motivo de Consulta: {{ medico.motivoConsulta }}</p>
      <p>Fecha: {{ medico.fechaConsulta }}</p>
    </div>
  </div>
}
