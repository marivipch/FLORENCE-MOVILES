@if (medico) {
  <div class="contMed">
    <div class="nomMed">
      <h4>{{ medico.nombre }}</h4>
      <span class="especialidad">{{ medico.especialidad }}</span>
    </div>

    <div class="datosMed">
      <p><strong>Registro Médico:</strong> {{ medico.codigoRegistro }}</p>
      <p><strong>Motivo de Consulta:</strong> {{ medico.motivoConsulta }}</p>
      <p class="fecha"><strong>Fecha:</strong> {{ medico.fechaConsulta }}</p>
    </div>
  </div>
}
